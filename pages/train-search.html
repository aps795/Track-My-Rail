<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search Trains | Track My Rail</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .search-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        @media(min-width: 768px) {
            .search-grid {
                grid-template-columns: 1fr 1fr 1fr auto;
                align-items: flex-end;
            }
        }
        
        .train-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        @media(min-width: 768px) {
            .train-card {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .train-info h3 {
            font-size: 1.3rem;
            color: var(--accent-primary);
            margin-bottom: 8px;
        }

        .train-route {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-secondary);
        }

        .route-arrow {
            color: var(--glass-border);
            position: relative;
        }

        .route-arrow::after {
            content: '';
            position: absolute;
            left: 50%; top: 50%;
            width: 40px; height: 1px;
            background: var(--glass-border);
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .time-box {
            text-align: center;
        }

        .time-val {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .time-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }
        
        .train-actions {
            display: flex;
            gap: 12px;
            flex-direction: column;
            width: 100%;
        }

        @media(min-width: 768px) {
            .train-actions {
                width: auto;
                flex-direction: row;
            }
        }

        .loading-skeleton {
            display: none;
            padding: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-container container">
            <a href="../index.html" class="logo">
                <i class="fas fa-train-subway"></i> Track My Rail
            </a>
            <ul class="desktop-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="train-search.html" class="active">Search</a></li>
                <li><a href="live-status.html">Live Status</a></li>
                <li><a href="pnr-status.html">PNR Status</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        
        <div class="glass-panel" style="padding: 32px; margin-bottom: 40px;">
            <h1 style="margin-bottom: 24px;">Search Trains</h1>
            <form id="searchForm" class="search-grid">
                <div style="position: relative;">
                    <label style="display:block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem;">From Station</label>
                    <input type="text" id="fromStation" class="input-modern" placeholder="e.g. NDLS" required autocomplete="off">
                </div>
                <div style="position: relative;">
                    <label style="display:block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem;">To Station</label>
                    <input type="text" id="toStation" class="input-modern" placeholder="e.g. MMCT" required autocomplete="off">
                </div>
                <div>
                    <label style="display:block; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.9rem;">Journey Date</label>
                    <input type="date" id="journeyDate" class="input-modern" required>
                </div>
                <button type="submit" class="btn-primary" style="height: 52px;">
                    <i class="fas fa-search"></i> Search
                </button>
            </form>
        </div>

        <div id="loadingState" class="loading-skeleton glass-panel">
            <div style="font-size: 2rem; color: var(--accent-primary); animation: pulse-green 1s infinite;"><i class="fas fa-satellite-dish"></i></div>
            <p style="margin-top: 16px; color: var(--text-secondary);">Scanning network...</p>
        </div>

        <div id="resultsContainer"></div>

    </main>

    <nav class="bottom-nav">
        <ul class="bottom-nav-list">
            <a href="../index.html" class="bottom-nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="train-search.html" class="bottom-nav-item active">
                <i class="fas fa-search"></i>
                <span>Search</span>
            </a>
            <a href="live-status.html" class="bottom-nav-item">
                <i class="fas fa-location-crosshairs"></i>
                <span>Live</span>
            </a>
            <a href="pnr-status.html" class="bottom-nav-item">
                <i class="fas fa-ticket-alt"></i>
                <span>PNR</span>
            </a>
        </ul>
    </nav>

    <script src="../script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('journeyDate');
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;

            // Handle query params from homepage
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            if(query) {
                document.getElementById('fromStation').value = query;
            }

            document.getElementById('searchForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const from = document.getElementById('fromStation').value.toUpperCase();
                const to = document.getElementById('toStation').value.toUpperCase();
                const date = document.getElementById('journeyDate').value;
                
                document.getElementById('loadingState').style.display = 'block';
                document.getElementById('resultsContainer').innerHTML = '';

                try {
                    let data = await RailTrack.searchTrains(from, to, date);
                    if (!data || !data.success || !data.trains || data.trains.length === 0) {
                        data = { trains: generateMockTrains(from, to) };
                    }
                    renderTrains(data.trains);
                } catch (err) {
                    renderTrains(generateMockTrains(from, to));
                } finally {
                    document.getElementById('loadingState').style.display = 'none';
                }
            });
        });

        function generateMockTrains(from, to) {
            return [
                {
                    trainNumber: '12951',
                    trainName: 'Rajdhani Express',
                    from: from,
                    to: to,
                    departureTime: '16:25',
                    arrivalTime: '08:15',
                    duration: '15h 50m',
                    classes: ['1A', '2A', '3A']
                },
                {
                    trainNumber: '12903',
                    trainName: 'Golden Temple Mail',
                    from: from,
                    to: to,
                    departureTime: '18:45',
                    arrivalTime: '11:20',
                    duration: '16h 35m',
                    classes: ['SL', '3A', '2A', '1A']
                }
            ];
        }

        function renderTrains(trains) {
            const container = document.getElementById('resultsContainer');
            
            if (trains.length === 0) {
                container.innerHTML = `
                    <div class="glass-panel" style="padding: 40px; text-align: center;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 16px;"></i>
                        <h3 style="color: var(--text-secondary);">No trains found</h3>
                    </div>`;
                return;
            }

            trains.forEach(t => {
                const card = document.createElement('div');
                card.className = 'glass-panel train-card';
                
                const classesHTML = t.classes ? t.classes.map(c => `<span class="badge badge-neutral">${c}</span>`).join('') : '';

                card.innerHTML = `
                    <div class="train-info">
                        <h3>${t.trainName} <span style="color: var(--text-muted); font-weight: 500;">(#${t.trainNumber})</span></h3>
                        <div style="margin-bottom: 12px;">${classesHTML}</div>
                        
                        <div class="train-route">
                            <div class="time-box">
                                <div class="time-val">${t.departureTime}</div>
                                <div class="time-label">${t.from}</div>
                            </div>
                            <div class="route-arrow">
                                <i class="fas fa-clock" style="background: var(--bg-level-1); padding: 0 8px; z-index: 1;"></i>
                                <div style="font-size: 0.75rem; text-align: center; margin-top: 4px; color: var(--text-muted);">${t.duration}</div>
                            </div>
                            <div class="time-box">
                                <div class="time-val">${t.arrivalTime}</div>
                                <div class="time-label">${t.to}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="train-actions">
                        <button class="btn-secondary" onclick="window.location.href='live-status.html'"><i class="fas fa-location-crosshairs"></i> Live Status</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
