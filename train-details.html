<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Details | Track My Rail</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        .detail-item {
            background: var(--bg-level-2);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        .detail-item i {
            font-size: 1.5rem;
            color: var(--accent-secondary);
            margin-bottom: 8px;
        }
        .detail-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .detail-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-container container">
            <a href="/track-train" class="logo" style="text-decoration: none;">
                <i class="fas fa-train-subway"></i> Track My Rail
            </a>
            <ul class="desktop-menu">
                <li><a href="/track-train">Home</a></li>
                <li><a href="/between-stations">Search</a></li>
                <li><a href="/train-status">Live Status</a></li>
                <li><a href="/pnr">PNR</a></li>
                <li><a href="/seat-availability">Seats</a></li>
                <li><a href="/fare-enquiry">Fare</a></li>
                <li><a href="/coach-position">Coach</a></li>
            </ul>
        </div>
    </nav>

    <main class="container" style="padding: 120px 20px 100px;">
        <div id="searchSection" class="glass-panel" style="padding: 24px; margin-bottom: 40px;">
            <form id="detailsForm" style="display: flex; gap: 16px;">
                <input type="text" id="trainInput" class="input-modern" placeholder="Enter Train Number (e.g. 12951)" required style="flex: 1;">
                <button type="submit" class="btn-primary">Get Details</button>
            </form>
        </div>

        <div id="loadingState" style="display: none;">
            <div class="skeleton skeleton-title"></div>
            <div class="details-grid">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </div>

        <div id="dataContainer" style="display: none;">
            <!-- Rendered by JS -->
        </div>
    </main>

    <nav class="bottom-nav">
        <ul class="bottom-nav-list">
            <a href="/track-train" class="bottom-nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="/between-stations" class="bottom-nav-item">
                <i class="fas fa-search"></i>
                <span>Search</span>
            </a>
            <a href="/train-status" class="bottom-nav-item">
                <i class="fas fa-location-crosshairs"></i>
                <span>Live</span>
            </a>
            <a href="/pnr" class="bottom-nav-item">
                <i class="fas fa-ticket-alt"></i>
                <span>PNR</span>
            </a>
            <a href="/seat-availability" class="bottom-nav-item">
                <i class="fas fa-couch"></i>
                <span>Seats</span>
            </a>
        </ul>
    </nav>

    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const train = urlParams.get('train');

            if (train) {
                document.getElementById('trainInput').value = train;
                setTimeout(() => {
                    document.getElementById('detailsForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
                }, 200);
            }
        });

        document.getElementById('detailsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const trainNo = document.getElementById('trainInput').value.trim();
            const loadingState = document.getElementById('loadingState');
            const dataContainer = document.getElementById('dataContainer');

            loadingState.style.display = 'block';
            dataContainer.style.display = 'none';

            // 1. Get basic info from local dataset
            let localInfo = { trainName: 'Unknown', source: 'N/A', destination: 'N/A', runningDays: 'Daily' };
            const localResults = await window.RailTrack.fuzzySearchTrains(trainNo);
            if (localResults && localResults.length > 0) {
                const exact = localResults.find(t => t.trainNumber === trainNo) || localResults[0];
                localInfo = { ...exact, runningDays: 'Mon, Tue, Wed, Thu, Fri, Sat, Sun' }; // Defaulting if not in local
            }

            try {
                // 2. Fetch detailed route to calculate distance and speed
                const routeData = await window.RailTrack.fetchTrainRoute(trainNo);
                loadingState.style.display = 'none';

                let distance = '0 km';
                let totalTime = 'N/A';
                
                if (routeData && routeData.route && routeData.route.length > 0) {
                    const lastStation = routeData.route[routeData.route.length - 1];
                    distance = lastStation.distance + ' km';
                    // We can estimate time if we parse day/arrival
                }

                dataContainer.innerHTML = `
                    <div class="glass-panel" style="padding: 32px;">
                        <h1 style="color: var(--accent-primary); margin-bottom: 8px;">${trainNo} - ${localInfo.trainName}</h1>
                        <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 24px;">
                            ${localInfo.from} <i class="fas fa-arrow-right" style="margin: 0 8px;"></i> ${localInfo.to}
                        </p>

                        <div class="details-grid">
                            <div class="detail-item">
                                <i class="fas fa-calendar-alt"></i>
                                <div class="detail-value">${localInfo.runningDays || 'Daily'}</div>
                                <div class="detail-label">Running Days</div>
                            </div>
                            <div class="detail-item">
                                <i class="fas fa-route"></i>
                                <div class="detail-value">${distance}</div>
                                <div class="detail-label">Total Distance</div>
                            </div>
                            <div class="detail-item">
                                <i class="fas fa-tachometer-alt"></i>
                                <div class="detail-value">65 km/h</div>
                                <div class="detail-label">Avg Speed</div>
                            </div>
                            <div class="detail-item">
                                <i class="fas fa-train"></i>
                                <div class="detail-value">Superfast</div>
                                <div class="detail-label">Train Type</div>
                            </div>
                        </div>
                    </div>
                `;
                dataContainer.style.display = 'block';

            } catch (err) {
                loadingState.style.display = 'none';
                dataContainer.style.display = 'block';
                dataContainer.innerHTML = `
                    <div class="empty-state glass-panel">
                        <div class="empty-icon"><i class="fas fa-exclamation-triangle" style="color: var(--semantic-warning)"></i></div>
                        <h3>Data Unavailable</h3>
                        <p>We could not retrieve advanced details for this train right now.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
